<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>stage-full · 进阶背景：圆盘 + 纸板 + 小素材（原型）</title>
  <style>
    @font-face { font-family: "SourceHanSansCN"; src: url("media/SourceHanSansCN-Regular.otf") format("opentype"); font-display: block; }
    body { margin: 0; background: #05070d; }
    .demo-root {
      position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
      font-family: "SourceHanSansCN", sans-serif; color: #2a2018; background: #10141d;
    }
    .layer { position: absolute; inset: 0; }
    .piece {
      position: absolute; width: 190px; height: 230px; border: 7px solid #fff; border-radius: 8px; box-sizing: border-box;
      box-shadow: 9px 11px 0 rgba(30,20,10,.28); display: flex; align-items: center; justify-content: center;
      font-size: 72px; color: rgba(255,255,255,.94);
    }
    .caption {
      position: absolute; left: 50%; top: 40px; transform: translateX(-50%); padding: 14px 34px; border-radius: 40px;
      background: rgba(16,20,29,.82); color: #f3e6cf; font-size: 40px; white-space: nowrap;
    }
  </style>
</head>
<body>
<main id="stage-full-advanced-demo" class="demo-root" data-composition-id="stage-full-advanced-demo"
      data-width="1920" data-height="1080" data-start="0" data-duration="16" data-fps="30">
  <section class="layer" data-hf-layer="background" aria-hidden="true"></section>
  <section class="layer" data-hf-layer="stage"></section>
  <section class="layer" data-hf-layer="text"><div class="caption" id="caption"></div></section>
</main>
<script src="runtime/gsap.min.js"></script>
<script src="runtime/scene-binding.js"></script>
<script src="runtime/stage-rig.js"></script>
<script src="runtime/motion.js"></script>
<script src="runtime/stage-motion.js"></script>
<script src="runtime/stage-kit.js"></script>
<script src="runtime/stage-kit/blocks/disc-scene.js"></script>
<script src="backdrop-advanced-demo.js"></script>
</body>
</html>

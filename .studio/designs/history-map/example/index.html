<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>三皇会战 · 拿破仑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="history-map-example" data-composition-id="history-map-example"
        data-start="0" data-duration="18" data-width="1920" data-height="1080" data-fps="30">
    <div data-hf-layer="background"></div>
    <div data-hf-layer="stage"><canvas id="map-canvas" width="1920" height="1080"></canvas></div>
    <div data-hf-layer="overlay" aria-hidden="true">
      <div data-scene-id="S01" data-start="0" data-duration="4"></div>
      <div data-scene-id="S02" data-start="4" data-duration="4.25"></div>
      <div data-scene-id="S03" data-start="8.25" data-duration="3.15"></div>
      <div data-scene-id="S04" data-start="11.4" data-duration="3.2"></div>
      <div data-scene-id="S05" data-start="14.6" data-duration="3.4"></div>
    </div>
    <div id="map-text" data-hf-layer="text"></div>
  </main>
  <script src="runtime/gsap.min.js"></script>
  <script src="runtime/MotionPathPlugin.min.js"></script>
  <script src="runtime/three.min.js"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>

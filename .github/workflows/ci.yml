name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
            node: '22'
          - os: macos-latest
            python: '3.12'
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: macOS system tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Python image dependency
        run: python3 -m pip install Pillow==12.3.0
      - name: Tool parser
        run: npm ci --prefix .studio/parser --ignore-scripts --no-audit --no-fund
      - name: Dependency parser from the Windows pins
        run: python3 .studio/prepare_windows_runtime.py dev-parser --cache "$RUNNER_TEMP/npm-cache"
      - name: Unit tests (includes the public boundary checks)
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export TMPDIR="$(python3 -c 'import pathlib, tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve())')"
          python3 -m unittest discover -s tests -q

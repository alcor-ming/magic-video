name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Python image dependency
        run: python3 -m pip install Pillow==12.3.0
      - name: Tool parser
        run: npm ci --prefix .studio/parser --ignore-scripts --no-audit --no-fund
      - name: Dependency parser from the Windows pins
        run: python3 .studio/prepare_windows_runtime.py dev-parser --cache "$RUNNER_TEMP/npm-cache"
      - name: Unit tests (includes the public boundary checks)
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -q
